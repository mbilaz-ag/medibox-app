name: Build MediBox Google Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore permanent signing key outside checkout
        env:
          MEDIBOX_KEYSTORE_BASE64: ${{ secrets.MEDIBOX_KEYSTORE_BASE64 }}
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: python3 tool/restore_release_keystore.py
      - name: Prepare Android project for Google Play
        run: |
          flutter create --no-pub --platforms=android,ios --project-name medibox --org lt.medibox "$RUNNER_TEMP/medibox-native"
          python3 tool/prepare_platforms.py "$RUNNER_TEMP/medibox-native"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build signed Android App Bundle
        env:
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: |
          flutter build appbundle --release
          cp build/app/outputs/bundle/release/app-release.aab MediBox-v0.19.0-build43.aab
      - name: Verify AAB signature and target API
        run: |
          jarsigner -verify -verbose -certs MediBox-v0.19.0-build43.aab
          grep -q 'targetSdk = 36' android/app/build.gradle.kts
      - uses: actions/upload-artifact@v4
        with:
          name: MediBox-Google-Play-AAB
          path: MediBox-v0.19.0-build43.aab
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('MEDIBOX_KEYSTORE_PATH')
          if value:
              key = Path(value).resolve()
              root = Path(os.environ['RUNNER_TEMP']).resolve()
              if key.name != 'release.p12' or key.parent.parent != root or not key.parent.name.startswith('medibox-signing-'):
                  raise SystemExit('Unexpected signing key location')
              key.unlink(missing_ok=True)
              key.parent.rmdir()
          PY
