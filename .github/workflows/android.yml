name: Build MediBox Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Prepare native projects without changing Dart source
        run: |
          flutter create --no-pub --platforms=android,ios --project-name medibox --org lt.medibox "$RUNNER_TEMP/medibox-native"
          python3 tool/prepare_platforms.py "$RUNNER_TEMP/medibox-native"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build MediBox v0.17.2 universal Android APK
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk MediBox-v0.17.2-universal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MediBox-Android-Universal-APK
          path: MediBox-v0.17.2-universal.apk
          if-no-files-found: error
      - name: Preserve generated native source and dependency resolution
        uses: actions/upload-artifact@v4
        with:
          name: MediBox-native-source
          path: |
            android/
            ios/
            pubspec.lock
          if-no-files-found: error
