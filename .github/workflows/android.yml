name: Build MediBox Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore permanent signing key outside checkout
        if: github.event_name != 'pull_request'
        env:
          MEDIBOX_KEYSTORE_BASE64: ${{ secrets.MEDIBOX_KEYSTORE_BASE64 }}
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: python3 tool/restore_release_keystore.py
      - name: Prepare native projects without changing Dart source
        run: |
          flutter create --no-pub --platforms=android,ios --project-name medibox --org lt.medibox "$RUNNER_TEMP/medibox-native"
          python3 tool/prepare_platforms.py "$RUNNER_TEMP/medibox-native"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        with:
          name: MediBox-body-map-previews
          path: build/body-map-previews/*.png
          if-no-files-found: error
      - name: Build MediBox v0.19.0 universal Android APK
        if: github.event_name != 'pull_request'
        env:
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk MediBox-v0.19.0-universal.apk
      - name: Verify APK signer before publishing
        if: github.event_name != 'pull_request'
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          python3 tool/verify_apk_signer.py "$apksigner_path" MediBox-v0.19.0-universal.apk
          "$apksigner_path" verify --print-certs MediBox-v0.19.0-universal.apk | grep 'certificate SHA-256 digest'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: MediBox-Android-Universal-APK
          path: MediBox-v0.19.0-universal.apk
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('MEDIBOX_KEYSTORE_PATH')
          if value:
              key = Path(value).resolve()
              root = Path(os.environ['RUNNER_TEMP']).resolve()
              if key.name != 'release.p12' or key.parent.parent != root or not key.parent.name.startswith('medibox-signing-'):
                  raise SystemExit('Unexpected signing key location')
              key.unlink(missing_ok=True)
              key.parent.rmdir()
          PY
      - name: Preserve generated native source and dependency resolution
        uses: actions/upload-artifact@v4
        with:
          name: MediBox-native-source
          path: |
            android/
            ios/
            pubspec.lock
          if-no-files-found: error
