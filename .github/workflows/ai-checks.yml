name: Validate Firebase leaflet integration (no APK)

on:
  push:
    branches: [feature/firebase-leaflet-drafts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediBox-leaflet-validation
          path: |
            pubspec.lock
            build/body-map-previews/*.png
          if-no-files-found: warn
