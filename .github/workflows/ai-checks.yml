name: Validate Firebase leaflet integration (no APK)

on:
  push:
    branches:
      - feature/firebase-leaflet-drafts
      - feature/medicine-ai-safety
      - feature/google-sync
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test test
      - name: Restore permanent signing key outside checkout
        env:
          MEDIBOX_KEYSTORE_BASE64: ${{ secrets.MEDIBOX_KEYSTORE_BASE64 }}
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: python3 tool/restore_release_keystore.py
      - name: Verify release certificate and print SHA-1
        env:
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v \
            -keystore "$MEDIBOX_KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass:env MEDIBOX_KEYSTORE_PASSWORD \
            -alias medibox-release | grep 'SHA1:'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MediBox-leaflet-validation
          path: |
            pubspec.lock
            build/body-map-previews/*.png
          if-no-files-found: warn
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('MEDIBOX_KEYSTORE_PATH')
          if value:
              key = Path(value).resolve()
              root = Path(os.environ['RUNNER_TEMP']).resolve()
              if key.name != 'release.p12' or key.parent.parent != root or not key.parent.name.startswith('medibox-signing-'):
                  raise SystemExit('Unexpected signing key location')
              key.unlink(missing_ok=True)
              key.parent.rmdir()
          PY
