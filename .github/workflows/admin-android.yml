name: Build MediBox Admin Android APK

on:
  workflow_dispatch:
  push:
    branches: [feature/reminder-repeat-30]
    paths:
      - 'admin_app/**'
      - '.github/workflows/admin-android.yml'
      - 'tool/android_signing.py'
      - 'tool/restore_release_keystore.py'
      - 'tool/verify_apk_signer.py'

permissions:
  contents: write

concurrency:
  group: admin-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Restore permanent signing key
        env:
          MEDIBOX_KEYSTORE_BASE64: ${{ secrets.MEDIBOX_KEYSTORE_BASE64 }}
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: python3 tool/restore_release_keystore.py
      - name: Prepare standalone Android application
        run: |
          flutter create --no-pub --platforms=android --project-name medibox_admin --org lt.medibox "$RUNNER_TEMP/medibox-admin-native"
          python3 admin_app/tool/prepare_android.py "$RUNNER_TEMP/medibox-admin-native"
      - name: Install dependencies
        working-directory: admin_app
        run: flutter pub get
      - name: Analyze
        working-directory: admin_app
        run: flutter analyze
      - name: Test
        working-directory: admin_app
        run: flutter test
      - name: Read version
        id: version
        working-directory: admin_app
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=MediBox-Admin-v${version}.apk" >> "$GITHUB_OUTPUT"
      - name: Build signed APK
        working-directory: admin_app
        env:
          MEDIBOX_KEYSTORE_PASSWORD: ${{ secrets.MEDIBOX_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "../${{ steps.version.outputs.apk }}"
      - name: Verify APK signer
        run: |
          apksigner_path=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          python3 tool/verify_apk_signer.py "$apksigner_path" "${{ steps.version.outputs.apk }}"
          keytool -list -v \
            -keystore "$MEDIBOX_KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass:env MEDIBOX_KEYSTORE_PASSWORD \
            -alias medibox-release | grep 'SHA1:'
      - uses: actions/upload-artifact@v4
        with:
          name: MediBox-Admin-Android-APK
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error
      - name: Publish Admin APK
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: admin-v${{ steps.version.outputs.version }}
          name: MediBox Admin v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.version.outputs.apk }}
      - name: Remove temporary signing key
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get('MEDIBOX_KEYSTORE_PATH')
          if value:
              key = Path(value).resolve()
              root = Path(os.environ['RUNNER_TEMP']).resolve()
              if key.name != 'release.p12' or key.parent.parent != root or not key.parent.name.startswith('medibox-signing-'):
                  raise SystemExit('Unexpected signing key location')
              key.unlink(missing_ok=True)
              key.parent.rmdir()
          PY
