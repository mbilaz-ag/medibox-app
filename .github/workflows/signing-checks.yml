name: Check permanent signing configuration (no APK)

on:
  push:
    branches: [feature/permanent-signing]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Check signing guards
        run: python3 -m unittest discover -s test -p 'test_android_signing.py' -v
      - name: Prepare native configuration
        run: |
          flutter create --no-pub --platforms=android,ios --project-name medibox --org lt.medibox "$RUNNER_TEMP/medibox-native"
          python3 tool/prepare_platforms.py "$RUNNER_TEMP/medibox-native"
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test test
      - name: Validate Gradle configuration without compiling an APK
        working-directory: android
        run: ./gradlew help --no-daemon
