name: Build MediBox iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Prepare native projects without changing Dart source
        run: |
          flutter config --no-enable-swift-package-manager
          flutter create --no-pub --platforms=android,ios --project-name medibox --org lt.medibox "$RUNNER_TEMP/medibox-native"
          python3 tool/prepare_platforms.py "$RUNNER_TEMP/medibox-native"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Verify iOS compilation without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for free personal signing
        run: |
          mkdir -p build/ios/free-install/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/free-install/Payload/Runner.app
          cd build/ios/free-install
          zip -qry "${GITHUB_WORKSPACE}/MediBox-v0.20.1-unsigned.ipa" Payload
          unzip -t "${GITHUB_WORKSPACE}/MediBox-v0.20.1-unsigned.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: MediBox-iOS-free-install
          path: MediBox-v0.20.1-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
